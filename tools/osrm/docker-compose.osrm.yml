# Local OSRM engines for the three product travel profiles.
#
# WHY THREE SERVERS. OSRM bakes the travel profile into the DATASET during
# `osrm-extract`; `osrm-routed` then ignores the profile segment in the request
# URL. A car-preprocessed dataset therefore answers `/route/v1/walking/...`
# with driving geometry. Genuine walking and cycling routing needs separately
# preprocessed data and its own server — not a different URL.
#
# DRIVING IS UNCHANGED. The service name (`osrm-routed`), its port and its data
# directory are exactly what they were, so an already-prepared driving dataset
# keeps working and needs no re-extraction. Walking and cycling are additive and
# entirely optional.

x-osrm: &osrm
  image: ghcr.io/project-osrm/osrm-backend:v5.27.1

services:
  # --- driving (existing; do not rename or relocate) -------------------------
  osrm-extract:
    <<: *osrm
    command: osrm-extract -p /opt/car.lua /data/${OSRM_DATASET:-turkey-latest}.osm.pbf
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data"

  osrm-partition:
    <<: *osrm
    command: osrm-partition /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data"

  osrm-customize:
    <<: *osrm
    command: osrm-customize /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data"

  osrm-routed:
    <<: *osrm
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data:ro"
    ports:
      # Driving keeps its own variable and default. Installations commonly
      # override it (this project's local setup uses 5001), which is why the
      # optional profiles below default to 5002/5003 rather than 5001/5002 —
      # those would collide with an overridden driving port. Compose does NOT
      # reject duplicate published ports at `config` time; only the container
      # start fails, so the defaults have to be collision-free by construction.
      - "${OSRM_HOST_PORT:-5000}:5000"
    restart: unless-stopped

  # --- walking ---------------------------------------------------------------
  # The SOURCE PBF is bind-mounted as a single read-only file so one download
  # feeds all three profiles; only the generated .osrm* artifacts are separate.
  # Mounting the whole shared directory instead would make osrm-extract write
  # its output over the driving dataset.
  osrm-extract-walking:
    <<: *osrm
    command: osrm-extract -p /opt/foot.lua /data/${OSRM_DATASET:-turkey-latest}.osm.pbf
    volumes:
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data"
      - "${OSRM_DATA_DIR:-./data}/${OSRM_DATASET:-turkey-latest}.osm.pbf:/data/${OSRM_DATASET:-turkey-latest}.osm.pbf:ro"

  osrm-partition-walking:
    <<: *osrm
    command: osrm-partition /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data"

  osrm-customize-walking:
    <<: *osrm
    command: osrm-customize /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data"

  osrm-walking:
    <<: *osrm
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data:ro"
    ports:
      - "${OSRM_WALKING_HOST_PORT:-5002}:5000"
    restart: unless-stopped

  # --- cycling ---------------------------------------------------------------
  osrm-extract-cycling:
    <<: *osrm
    command: osrm-extract -p /opt/bicycle.lua /data/${OSRM_DATASET:-turkey-latest}.osm.pbf
    volumes:
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data"
      - "${OSRM_DATA_DIR:-./data}/${OSRM_DATASET:-turkey-latest}.osm.pbf:/data/${OSRM_DATASET:-turkey-latest}.osm.pbf:ro"

  osrm-partition-cycling:
    <<: *osrm
    command: osrm-partition /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data"

  osrm-customize-cycling:
    <<: *osrm
    command: osrm-customize /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data"

  osrm-cycling:
    <<: *osrm
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data:ro"
    ports:
      - "${OSRM_CYCLING_HOST_PORT:-5003}:5000"
    restart: unless-stopped
