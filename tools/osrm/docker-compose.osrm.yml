# Local OSRM engines for the three product travel profiles.
#
# WHY THREE SERVERS. OSRM bakes the travel profile into the DATASET during
# `osrm-extract`; `osrm-routed` then ignores the profile segment in the request
# URL. A car-preprocessed dataset therefore answers `/route/v1/walking/...`
# with driving geometry. Genuine walking and cycling routing needs separately
# preprocessed data and its own server — not a different URL.
#
# DRIVING IS UNCHANGED. The service name (`osrm-routed`), its port and its data
# directory are exactly what they were, so an already-prepared driving dataset
# keeps working and needs no re-extraction. Walking and cycling are additive and
# entirely optional.

x-osrm: &osrm
  image: ghcr.io/project-osrm/osrm-backend:v5.27.1

services:
  # --- driving (existing; do not rename or relocate) -------------------------
  osrm-extract:
    <<: *osrm
    command: osrm-extract -p /opt/car.lua /data/${OSRM_DATASET:-turkey-latest}.osm.pbf
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data"

  osrm-partition:
    <<: *osrm
    command: osrm-partition /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data"

  osrm-customize:
    <<: *osrm
    command: osrm-customize /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data"

  osrm-routed:
    <<: *osrm
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/data:ro"
    ports:
      # Driving keeps its own variable and default. Installations commonly
      # override it (this project's local setup uses 5001), which is why the
      # optional profiles below default to 5002/5003 rather than 5001/5002 —
      # those would collide with an overridden driving port. Compose does NOT
      # reject duplicate published ports at `config` time; only the container
      # start fails, so the defaults have to be collision-free by construction.
      - "${OSRM_HOST_PORT:-5000}:5000"
    restart: unless-stopped

  # --- walking ---------------------------------------------------------------
  # MOUNT TOPOLOGY. The shared source directory is mounted read-only at its own
  # target (/source) and the profile output directory writable at /data. The two
  # targets must NOT overlap: bind-mounting the source PBF *inside* /data is a
  # nested mount, which Docker Desktop's virtiofs rejects outright ("mountpoint
  # is outside the rootfs") before osrm-extract even starts.
  #
  # osrm-extract writes its generated dataset BESIDE the input file, so the input
  # cannot live on the read-only /source mount. The PBF is therefore copied into
  # the writable profile directory for the duration of extraction and removed
  # afterwards — a transient copy, not a second permanent download.
  #
  # THREAD CAP. `osrm-extract` scales its peak memory with thread count: on a
  # 12-thread machine with a ~10 GB Docker limit, edge-expansion was OOM-killed
  # around 30%. The optional profiles therefore pass an explicit, low default
  # (4) instead of letting OSRM use every core. Raise
  # OSRM_OPTIONAL_EXTRACT_THREADS if Docker has more memory available. Driving
  # is deliberately left alone — its dataset is already prepared and its
  # pipeline must not change.
  osrm-extract-walking:
    <<: *osrm
    entrypoint: ["/bin/sh", "-c"]
    # LIST form, exactly ONE element. A scalar `command: >` is a STRING, and
    # Compose shell-splits string commands into argv — the whole lifecycle
    # collapsed to ["set", "-e"] and everything after the first `;` was lost.
    # A single-item sequence is passed through verbatim, which is what
    # `sh -c` needs: one argument holding the entire script.
    command:
      - >-
        set -e;
        test -f "/source/${OSRM_DATASET:-turkey-latest}.osm.pbf";
        cp "/source/${OSRM_DATASET:-turkey-latest}.osm.pbf" "/data/${OSRM_DATASET:-turkey-latest}.osm.pbf";
        osrm-extract -t "${OSRM_OPTIONAL_EXTRACT_THREADS:-4}" -p /opt/foot.lua "/data/${OSRM_DATASET:-turkey-latest}.osm.pbf";
        rm -f "/data/${OSRM_DATASET:-turkey-latest}.osm.pbf"
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/source:ro"
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data"

  osrm-partition-walking:
    <<: *osrm
    command: osrm-partition /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data"

  osrm-customize-walking:
    <<: *osrm
    command: osrm-customize /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data"

  osrm-walking:
    <<: *osrm
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_WALKING_DATA_DIR:-./data/walking}:/data:ro"
    ports:
      - "${OSRM_WALKING_HOST_PORT:-5002}:5000"
    restart: unless-stopped

  # --- cycling ---------------------------------------------------------------
  # Same non-overlapping /source + /data topology as walking above.
  osrm-extract-cycling:
    <<: *osrm
    entrypoint: ["/bin/sh", "-c"]
    # LIST form, exactly ONE element. A scalar `command: >` is a STRING, and
    # Compose shell-splits string commands into argv — the whole lifecycle
    # collapsed to ["set", "-e"] and everything after the first `;` was lost.
    # A single-item sequence is passed through verbatim, which is what
    # `sh -c` needs: one argument holding the entire script.
    command:
      - >-
        set -e;
        test -f "/source/${OSRM_DATASET:-turkey-latest}.osm.pbf";
        cp "/source/${OSRM_DATASET:-turkey-latest}.osm.pbf" "/data/${OSRM_DATASET:-turkey-latest}.osm.pbf";
        osrm-extract -t "${OSRM_OPTIONAL_EXTRACT_THREADS:-4}" -p /opt/bicycle.lua "/data/${OSRM_DATASET:-turkey-latest}.osm.pbf";
        rm -f "/data/${OSRM_DATASET:-turkey-latest}.osm.pbf"
    volumes:
      - "${OSRM_DATA_DIR:-./data}:/source:ro"
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data"

  osrm-partition-cycling:
    <<: *osrm
    command: osrm-partition /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data"

  osrm-customize-cycling:
    <<: *osrm
    command: osrm-customize /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data"

  osrm-cycling:
    <<: *osrm
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-turkey-latest}.osrm
    volumes:
      - "${OSRM_CYCLING_DATA_DIR:-./data/cycling}:/data:ro"
    ports:
      - "${OSRM_CYCLING_HOST_PORT:-5003}:5000"
    restart: unless-stopped
